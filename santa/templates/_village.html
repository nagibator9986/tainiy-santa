{% macro house(x, y, s=1, lit=(true, true)) %}
<g transform="translate({{ x }} {{ y }}) scale({{ s }})">
  <g class="smoke">
    <circle cx="19.5" cy="-2" r="3"/><circle cx="19.5" cy="-2" r="3.6"/><circle cx="19.5" cy="-2" r="4.2"/>
  </g>
  <rect class="chimney" x="16" y="2" width="7" height="16"/>
  <rect class="chimney-snow" x="15" y="0.6" width="9" height="3" rx="1.5"/>
  <rect class="wall" x="6" y="26" width="52" height="34"/>
  <path class="roof" d="M0 28 L32 4 L64 28 Z"/>
  <path class="roof-snow" d="M-1 28.4 L32 3 L65 28.4 L61 30.6 C 54 25.6 48 28.6 41 23.8 C 35 19.8 30 23.6 23.6 25.4 C 15 28 9 26.4 3 30.6 Z"/>
  <rect class="win{{ '' if lit[0] else ' win--off' }}" x="13" y="35" width="13" height="12" rx="1"/>
  <path class="mullion" d="M19.5 35 V47 M13 41 H26"/>
  <rect class="door" x="37" y="38" width="11" height="22" rx="1"/>
  <rect class="win win--small{{ '' if lit[1] else ' win--off' }}" x="39.5" y="41" width="6" height="5" rx=".6"/>
</g>
{% endmacro %}

<footer class="village">
  <svg class="village-art" viewBox="0 0 1440 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="spruce" viewBox="0 0 40 80"><path d="M20 0 L31 20 H25 L36 40 H28 L40 62 H23 V80 H17 V62 H0 L12 40 H4 L15 20 H9 Z"/></symbol>
      <symbol id="spruce-snow" viewBox="0 0 40 80">
        <path class="tree-body" fill="currentColor" d="M20 0 L31 20 H25 L36 40 H28 L40 62 H23 V80 H17 V62 H0 L12 40 H4 L15 20 H9 Z"/>
        <path class="tree-snow" fill="#f3f7fd" d="M20 0 L26 11 C 22 13 18 13 14 11 Z M25 20 L30 30 C 24 32 16 32 10 30 L15 20 Z M28 40 L34 51 C 26 53.5 14 53.5 6 51 L12 40 Z"/>
      </symbol>
    </defs>

    <path class="hill hill--far" d="M0 150 C 140 110 260 100 400 128 C 540 156 660 96 820 104 C 980 112 1080 150 1220 132 C 1320 120 1390 112 1440 118 V300 H0 Z"/>
    <g class="trees trees--far">
      <use href="#spruce" x="40" y="96" width="20" height="40"/>
      <use href="#spruce" x="62" y="104" width="16" height="32"/>
      <use href="#spruce" x="300" y="88" width="22" height="44"/>
      <use href="#spruce" x="326" y="98" width="16" height="32"/>
      <use href="#spruce" x="700" y="74" width="22" height="44"/>
      <use href="#spruce" x="724" y="84" width="17" height="34"/>
      <use href="#spruce" x="880" y="70" width="20" height="40"/>
      <use href="#spruce" x="1150" y="98" width="22" height="44"/>
      <use href="#spruce" x="1176" y="108" width="15" height="30"/>
      <use href="#spruce" x="1350" y="80" width="20" height="40"/>
    </g>

    <path class="hill hill--mid" d="M0 196 C 180 160 340 168 500 186 C 660 204 820 150 1000 158 C 1160 166 1300 190 1440 176 V300 H0 Z"/>
    {{ house(180, 118, 0.9) }}
    {{ house(512, 128, 1, (true, false)) }}
    {{ house(586, 146, 0.72, (false, true)) }}
    {{ house(1040, 98, 1.08) }}
    {{ house(1300, 132, 0.8, (true, true)) }}
    <g class="trees trees--mid">
      <use href="#spruce-snow" x="120" y="126" width="30" height="60"/>
      <use href="#spruce-snow" x="250" y="132" width="26" height="52"/>
      <use href="#spruce-snow" x="452" y="120" width="34" height="68"/>
      <use href="#spruce-snow" x="660" y="122" width="28" height="56"/>
      <use href="#spruce-snow" x="960" y="104" width="32" height="64"/>
      <use href="#spruce-snow" x="1132" y="118" width="26" height="52"/>
      <use href="#spruce-snow" x="1236" y="120" width="30" height="60"/>
      <use href="#spruce-snow" x="1392" y="128" width="28" height="56"/>
    </g>

    <path class="hill hill--near" d="M0 244 C 220 222 420 230 640 240 C 860 250 1080 222 1300 230 C 1370 233 1410 238 1440 236 V300 H0 Z"/>
    <g class="snowman" transform="translate(860 196)">
      <ellipse class="snowman-shadow" cx="0" cy="46" rx="22" ry="4"/>
      <circle class="snowman-ball" cx="0" cy="34" r="14"/>
      <circle class="snowman-ball" cx="0" cy="13" r="10"/>
      <circle class="snowman-ball" cx="0" cy="-3.5" r="7.5"/>

      <circle class="snowman-coal" cx="0" cy="11" r="1.1"/><circle class="snowman-coal" cx="0" cy="16" r="1.1"/>
      <path class="snowman-arm" d="M-9 12 L -22 4 M -18 6.4 L -21 1 M 9 12 L 21 6 M 17.6 7.8 L 22 10.6"/>
    </g>
  </svg>
  <div class="village-ground">
    <div class="wrap village-row">
      <p class="village-brand"><span class="hand">Тайный Санта</span> · {{ ev.year }}</p>
      <p class="village-note">Пары не видит никто — даже организатор.</p>
      <a class="village-link" href="{{ url_for('admin.dashboard') }}">Почтмейстеру →</a>
    </div>
  </div>
</footer>
